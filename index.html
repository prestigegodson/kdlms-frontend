<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#3B4FD9" />
    <meta
      name="description"
      content="KDLMS — school management for Pre School through Secondary: academics, results, attendance and guardians in one place."
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="KDLMS" />
    <title>KDLMS — School Management</title>
  </head>
  <body>
    <div id="root"></div>
    <!--
      Unsupported-browser fallback. The build reaches back to Chrome 64 /
      iOS 12 (package.json's "browserslist"): Tailwind 3 CSS, a modern ESM
      bundle, and a polyfilled `nomodule` legacy bundle from
      @vitejs/plugin-legacy. Below that floor the app can't run, so this shows
      a message instead of a blank page. Plain ES5 and inline styles on
      purpose: it must run where the app can't.
    -->
    <script>
      (function () {
        function showUnsupported() {
          var root = document.getElementById("root");
          if (!root || root.childNodes.length) return;
          root.innerHTML =
            '<div style="max-width:420px;margin:15vh auto 0;padding:24px;font-family:-apple-system,Segoe UI,Roboto,sans-serif;color:#1f2937;text-align:center;line-height:1.5">' +
            '<h1 style="font-size:20px;margin:0 0 12px">Please update your browser</h1>' +
            '<p style="margin:0 0 12px">Your browser is too old to run KDLMS. Please update Chrome or Safari, or your device\'s software, then reload this page.</p>' +
            '<p style="margin:0;font-size:14px;color:#6b7280">Check your browser version at <a href="https://www.whatismybrowser.com/" style="color:#3B4FD9">whatismybrowser.com</a>.</p>' +
            "</div>";
        }
        var supported = false;
        try {
          // Only what the legacy bundle can't polyfill: CSS variables (Tailwind 3
          // builds transforms, rings, shadows and color opacity on them),
          // Promise and fetch. JS syntax and other APIs are handled by the build.
          supported =
            !!window.CSS &&
            typeof CSS.supports === "function" &&
            CSS.supports("--a", "0") &&
            typeof window.Promise === "function" &&
            typeof window.fetch === "function";
        } catch (e) {
          supported = false;
        }
        if (!supported) {
          showUnsupported();
          return;
        }
        // Safety net: a root React never attached to (createRoot tags it with a
        // __reactContainer$ key) means the bundle failed. Not "root is empty":
        // the app legitimately renders null while the session hydrates. The
        // legacy bundle is imported asynchronously by SystemJS and can finish
        // well after `load` on a slow tablet, so give it a generous window; if
        // React mounts after the message went up, it replaces it.
        function reactAttached() {
          var root = document.getElementById("root");
          if (!root) return true;
          for (var key in root) {
            if (key.indexOf("__reactContainer$") === 0) return true;
          }
          return false;
        }
        window.addEventListener("load", function () {
          setTimeout(function () {
            if (!reactAttached()) showUnsupported();
          }, 15000);
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
