# Serves the built SPA and proxies /api (and /actuator, for container
# health checks) to the backend service - docker-compose.prod.yml puts
# both containers on one network, so `backend` resolves via Docker's
# embedded DNS. No API base URL baked into the frontend build: the app
# always calls a same-origin `/api/...`, and this is what makes that true
# in production (vite's dev-server proxy is what makes it true locally).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        # Matches spring.servlet.multipart.max-request-size so an oversize
        # upload surfaces the API's own 422, not nginx's 413 HTML page.
        # Learning audio/video never comes through here: the browser uploads
        # it straight to the bucket on presigned URLs.
        client_max_body_size 35m;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /actuator/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # Fingerprinted assets (Vite's content-hashed filenames) are safe to cache hard.
    # =404 (not the SPA fallback below) so a tab running a superseded build's
    # index.html asking for a chunk that's gone since a new deploy gets a real,
    # detectable 404 instead of an HTML document masquerading as JS - the
    # dynamic import then fails loudly and reloadOnce.ts's `vite:preloadError`
    # handler can recover it onto the current build.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Never cache the version probe reloadOnce.ts/useVersionCheck.ts poll -
    # staleness detection is pointless if the probe itself can be stale.
    location = /version.json {
        add_header Cache-Control "no-store";
    }

    # PWA manifest - short cache so icon/name changes roll out without a hard refresh.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        expires 1h;
        add_header Cache-Control "public";
    }

    # Icons aren't content-hashed like /assets/, but they change rarely - cache long
    # with revalidation rather than Vite's immutable treatment.
    location /icons/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # No-op service worker (src/utils/installPrompt.ts registers it, public/sw.js
    # is the source) - exists only to satisfy Chromium's install-prompt gate.
    # Never cache it: a stale copy would be painful to replace across every
    # already-registered client.
    location = /sw.js {
        default_type application/javascript;
        add_header Cache-Control "no-cache";
    }

    # index.html itself is never fingerprinted, so it must never be cached -
    # otherwise a browser's own heuristic caching (there's no explicit
    # Cache-Control without this) could keep serving a stale entry point
    # referencing chunks a new deploy has already removed. Named explicitly
    # (rather than relying on the fallback below) so it also covers a direct
    # request for "/index.html".
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback - client-side routing owns everything else.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
