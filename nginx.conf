# Serves the built SPA and proxies /api (and /actuator, for container
# health checks) to the backend service - docker-compose.prod.yml puts
# both containers on one network, so `backend` resolves via Docker's
# embedded DNS. No API base URL baked into the frontend build: the app
# always calls a same-origin `/api/...`, and this is what makes that true
# in production (vite's dev-server proxy is what makes it true locally).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        # Matches spring.servlet.multipart.max-file-size so an oversize upload
        # surfaces FileStorageService's own 422, not nginx's 413 HTML page.
        client_max_body_size 5m;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /actuator/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # Fingerprinted assets (Vite's content-hashed filenames) are safe to cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # PWA manifest - short cache so icon/name changes roll out without a hard refresh.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        expires 1h;
        add_header Cache-Control "public";
    }

    # Icons aren't content-hashed like /assets/, but they change rarely - cache long
    # with revalidation rather than Vite's immutable treatment.
    location /icons/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # SPA fallback - client-side routing owns everything else.
    location / {
        try_files $uri /index.html;
    }
}
